name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL real para os testes de integração: cada classe de teste cria e apaga o próprio banco.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AVATARCODEX_TEST_DB: Host=localhost;Port=5432;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AvatarCodex.sln

      - name: Build
        run: dotnet build AvatarCodex.sln --no-restore -c Release

      - name: Test
        run: dotnet test AvatarCodex.sln --no-build -c Release

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # O Cypress (E2E) não roda na CI por enquanto; pular o download do binário economiza tempo.
      CYPRESS_INSTALL_BINARY: 0

    defaults:
      run:
        working-directory: frontend/avatar-codex-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/avatar-codex-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
